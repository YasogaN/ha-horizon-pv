<svg xmlns="http://www.w3.org/2000/svg"
  width="512"
  height="512"
  viewBox="0 0 512 512">

  <title>Horizon Solar Forecast</title>

  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="#0F172A" />

  <!-- Sun -->
  <circle cx="256" cy="190" r="52" fill="#FACC15" />

  <!-- Horizon / Forecast Curve -->
  <path
    d="M96 330
       C150 330 175 240 256 240
       C337 240 362 330 416 330"
    fill="none"
    stroke="#38BDF8"
    stroke-width="18"
    stroke-linecap="round" />

  <!-- Energy Output Line -->
  <path
    d="M96 360
       C170 350 210 300 256 300
       C310 300 350 350 416 360"
    fill="none"
    stroke="#34D399"
    stroke-width="10"
    stroke-linecap="round"
    opacity="0.9" />

</svg>