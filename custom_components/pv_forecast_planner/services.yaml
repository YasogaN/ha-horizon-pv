update_forecast:
  name: Update forecast
  description: Fetch weather data and recalculate the solar forecast now.

learn:
  name: Learn
  description: Train the model on yesterday's actual production data from the recorder.

bootstrap:
  name: Bootstrap
  description: Scan recorder history and train the model on historical data.
  fields:
    days:
      name: Days
      description: Number of historical days to scan (default from config).
      required: false
      default: 7
      selector:
        number:
          min: 1
          max: 90
          unit_of_measurement: days

get_state:
  name: Get state
  description: Return the current model state as a service response.
